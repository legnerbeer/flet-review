[project]
site_name = "flet-review"
site_description = "In-app review prompt for Flet apps — wraps the Google Play / App Store review dialog"
site_author = "Andreas Legner"
site_url = "https://legnerbeer.github.io/flet-review/"
copyright = "Copyright &copy; 2026 Andreas Legner"
repo_url = "https://github.com/legnerbeer/flet-review"
repo_name = "legnerbeer/flet-review"
edit_uri = "edit/main/docs/"
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "Installation" = "installation.md" },
  { "Usage" = "usage.md" },
  { "API reference" = "api.md" },
  { "How it works" = "architecture.md" },
  { "Development" = "development.md" },
]

[project.theme]
language = "en"
favicon = "assets/favicon.svg"
font.text = "Inter"
font.code = "JetBrains Mono"
icon.logo = "lucide/star"
icon.repo = "fontawesome/brands/github"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
options.docstring_style = "google"
options.show_source = false
options.show_root_heading = true
options.members_order = "source"
options.filters = ["!^_", "!^before_update$"]

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
